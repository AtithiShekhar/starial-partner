name: sellermultivendor
description: A new Flutter project.

publish_to: "none"
version: 1.0.2+2
# version: 1.0.2+2

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  flutter_svg: ^1.1.6
  http: ^0.13.5
  jaguar_jwt: ^3.0.0
  flutter_ringtone_player: ^3.2.0
  shared_preferences: ^2.0.11
  connectivity_plus: ^3.0.2
  firebase_auth: ^4.2.1
  cached_network_image: ^3.3.1
  firebase_core: ^2.4.0
  country_code_picker: ^2.0.2
  intl: ^0.18.1
  flutter_localizations:
    sdk: flutter
  shimmer: ^2.0.0
  url_launcher: ^6.1.7
  sms_autofill: ^2.2.0
  image_picker: ^0.8.6
  fl_chart: ^0.55.2
  file_picker: ^5.2.5
  flutter_local_notifications: ^12.0.4
  firebase_messaging: ^14.1.4
  sticky_headers: ^0.3.0+2
  html_editor_enhanced: ^2.5.1
  mime: ^1.0.3
  lottie: ^2.1.0
  flutter_rating_bar: ^4.0.0
  photo_view: ^0.14.0
  flutter_widget_from_html: ^0.9.0+1
  provider: ^6.0.5
  flutter_inappwebview: ^5.7.2+3
  google_maps_flutter: ^2.2.2
  geocoding: ^2.0.5
  geolocator: ^9.0.2
  flutter_email_sender: ^5.2.0
  bloc: ^8.1.0

dependency_overrides:
  modal_bottom_sheet:
    git:
      url: https://github.com/danReynolds/modal_bottom_sheet.git
      path: modal_bottom_sheet
  pin_input_text_field: "4.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  just_audio: ^0.9.30

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animation/
    - lib/Language/
    - assets/images/PNG/
    - assets/images/SVG/
    - assets/alarm/

  fonts:
    - family: opensans
      fonts:
        - asset: assets/font/OpenSans-Regular.ttf
